  text_field: text
  scan_limit: 250000
  pool_size: 40000
  common_size: 20000
  min_chars: 64
  min_hangul_ratio: 0.35
  boilerplate_cleaner: none
inference:
  max_prompt_tokens: 128
  max_new_tokens: 128
  speculative_k: 4
  temperature: 0.0
  do_sample: false
  dtype: float16
  attention_backend: sdpa
  decoder: cached
  # Cached SD verifies k proposals in one target block on B200.  If a
  # near-tie disagrees with the batch-64 reference, Table 1 retries only that
  # prompt on the strict singleton target path.
  target_verification: batched_fallback
  smoke_prompts: 200
  compatibility_probe_prompts: 1000
  shard_size: 200
